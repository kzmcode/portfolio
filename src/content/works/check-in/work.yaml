descriptionEn: Developed a check-in and check-out management system for visitors to Akuigawa Common. Built a custom frontend using HTML, CSS, and JavaScript, with kintone as the data management platform. Focused on creating a simple, intuitive interface designed for smooth daily operations.
description: 鮎喰川コモンの利用者の入退室を記録・管理するシステムを開発しました。kintoneをデータ管理基盤として活用し、HTML・CSS・JavaScriptで専用のフロントエンドを構築。日々の運用を考慮し、シンプルで直感的な操作性を目指しました。
